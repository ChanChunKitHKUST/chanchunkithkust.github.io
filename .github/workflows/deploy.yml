name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Update _config.yml ⚙️
      uses: fjogeleit/yaml-update-action@v0.13.1
      with:
        commitChange: false
        valueFile: '_config.yml'
        propertyPath: 'giscus.repo'
        value: ${{ github.repository }}
    - name: Install and Build 🔧
      run: |
        python3 -m venv /tmp/site-build-python
        . /tmp/site-build-python/bin/activate
        pip install jupyter
        export JEKYLL_ENV=production
        bundle exec jekyll build
        touch _site/.nojekyll
    - name: Validate generated site
      run: |
        bundle exec ruby bin/tests/academic_content.rb
        python3 bin/tests/academic_markup.py
        node bin/tests/academic-search.test.cjs
    - name: Save production build for review
      uses: actions/upload-artifact@v4
      with:
        name: production-site
        path: _site
        include-hidden-files: true
        retention-days: 7
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site

