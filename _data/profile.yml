    dates: "Aug 2025 — Present"
    summary: "Belief revision and mental-state-guided agents."
    details:
      - "Conducted research on MuSeToM, a benchmark evaluating belief revision from textual cues across six senses, revealing a tendency to over-update on salient but insufficient evidence."
      - "Investigated belief–desire–intention modeling for LLM agents to guide decisions and actions in tool-use environments."
  - organization: Amazon
