role: Ph.D. Candidate in Computer Science & Engineering
affiliation: Hong Kong University of Science and Technology
focus: Large Language Models, Theory of Mind, Mental World Models & Post-Training
research:
  - title: "Theory of Mind & Mental World Models"
    description: "I study how language models infer beliefs, desires, and intentions. My goal is to develop Mental World Models that track these states over time, revise them with new evidence, and support socially informed reasoning."
    papers:
      - title: "XToM"
        url: "https://aclanthology.org/2026.acl-long.805/"
      - title: "MuSeToM"
        url: "/publications/#chan2026musetom"
        note: "Under Review"
  - title: "Post-Training for Decision-Making"
    description: "I investigate how mental-state understanding can improve decisions through Post-Training. My work combines belief–desire–intention supervision and reinforcement fine-tuning to predict customer behavior in e-commerce."
    papers:
      - title: "From Mind to Action"
        url: "/publications/#chan2026mind-action"
        note: "Under Review"
  - title: "Agents"
    description: "I study how agents infer others’ intentions and use that understanding to make decisions. My work examines Theory of Mind in negotiation and cooperative games, alongside my interest in mental-state-guided planning and tool use."
    papers:
      - title: "Guandan"
        url: "https://doi.org/10.48550/arXiv.2408.02559"
        note: "Co-First Author"
      - title: "NegotiationToM"
        url: "https://aclanthology.org/2024.findings-emnlp.244/"
