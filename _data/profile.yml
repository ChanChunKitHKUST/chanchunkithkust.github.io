    summary: "Theory of Mind and reinforcement fine-tuning for customer behavior prediction."
    details:
      - "Developed a Theory-of-Mind benchmark capturing customers’ latent mental states behind observed actions across e-commerce tasks."
      - "Used annotated belief–desire–intention states and reinforcement fine-tuning methods, including GRPO with Qwen3, to support customer behavior prediction."
  - organization: NVIDIA
    role: Scientist Intern
    dates: "Mar 2022 — Jan 2025"
    summary: "Prompt tuning for discourse, argument quality, and commonsense reasoning."
    details:
